name: Creator Studio AI - Continuous Integration & Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpq-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          APP_ENV: test
          APP_DEBUG: "true"
          APP_MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          APP_SECRET_KEY: "test-secret-key-32-chars-long-minimum!"
        run: |
          cd backend
          pytest -v

  frontend-checks:
    name: Frontend TypeScript, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npm run typecheck

      - name: Next.js Linter
        run: |
          cd frontend
          npm run lint

      - name: Production Build
        run: |
          cd frontend
          npm run build

  security-scan:
    name: Security & Secret Sanitization Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Uncommitted Secrets
        run: |
          echo "Scanning repository files for high-entropy secrets or accidentally exposed keys..."
          ! grep -rn "AIzaSy" . --exclude-dir={.git,.next,.venv,node_modules}
          ! grep -rn "ya29\." . --exclude-dir={.git,.next,.venv,node_modules}
          echo "No active Google API keys or OAuth access tokens found in tracking tree."
