services:
  postgres:
    image: postgres:16-alpine
    container_name: creator_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: creator_studio_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d creator_studio_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
